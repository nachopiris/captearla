# Fly.io config for Captearla. Deploy with `fly deploy` after `fly launch`
# (or `fly apps create`) and `fly secrets set GEMINI_API_KEY=...`.
app = "captearla"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  GEMINI_MODEL = "gemini-3.5-flash-lite"
  SESSIONS = "main-stage,room-a,room-b"

[http_service]
  internal_port = 3000
  force_https = true
  # Sessions, captions and pipelines live in memory: keep exactly one machine
  # always running so a talk is never cut by auto-stop or split across machines.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/sessions"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
