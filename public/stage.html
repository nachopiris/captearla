<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>captearla — stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand-group">
        <span class="brand">
          <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9h16" />
            <path d="M4 15h10" />
          </svg>
          <span class="brand-name">captearla</span>
        </span>
        <span class="stage-tag mono-label">Stage</span>
      </div>

      <div class="topbar-spacer"></div>

      <span id="statusBadge" class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span id="statusLabel">Idle</span>
      </span>
    </header>

    <main class="stage-grid">
      <div class="stage-left">
        <section class="panel">
          <h2>Session</h2>
          <div class="field">
            <label for="sessionInput" class="mono-label">Session id</label>
            <input id="sessionInput" list="knownSessions" placeholder="main-stage" autocomplete="off" />
            <datalist id="knownSessions"></datalist>
          </div>
          <p class="hint">
            Use one id per room. The audience picks the same id on the viewer.
          </p>

          <div class="field">
            <label for="sessionNameInput" class="mono-label">Session name</label>
            <input id="sessionNameInput" placeholder="Main stage" autocomplete="off" />
          </div>
          <p class="hint">
            Optional. Shown to the audience instead of the raw session id.
          </p>

          <div class="field">
            <span class="mono-label">Audience link</span>
            <div class="audience-link-row">
              <span id="audienceLink" class="audience-link"></span>
              <button id="copyLinkButton" class="btn-copy" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="12" height="12" rx="2" />
                  <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
                </svg>
                <span id="copyLinkLabel">Copy</span>
              </button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Microphone</h2>
          <div class="mic-buttons">
            <button id="startButton" class="btn-primary" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
                <path d="M12 19v3" />
              </svg>
              Start mic
            </button>
            <button id="stopButton" class="btn-danger" type="button" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="1.5" />
              </svg>
              Stop mic
            </button>
          </div>

          <div class="field">
            <span class="mono-label">Input level</span>
            <div
              id="levelMeter"
              class="level-meter"
              role="meter"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-label="Microphone input level"
            ></div>
          </div>
        </section>
      </div>

      <section class="panel stage-preview">
        <div class="stage-preview-header">
          <h2>Live preview</h2>
          <span class="mono-label">Original language</span>
        </div>
        <div id="captionPreview" class="captions stage-captions">
          <p class="stage-captions-placeholder">No captions yet.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/stage.js"></script>
  </body>
</html>
