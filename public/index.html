<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>captearla — live captions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/landing.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand-group">
        <span class="brand">
          <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9h16" />
            <path d="M4 15h10" />
          </svg>
          <span class="brand-name">captearla</span>
        </span>
      </div>
    </header>

    <main class="landing-main">
      <p class="landing-tagline mono-label">So nobody misses the talk.</p>

      <div class="landing-cards">
        <a class="landing-card" href="/viewer.html">
          <svg class="landing-card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span class="landing-card-title">Viewer</span>
          <span class="landing-card-desc">
            Audience: pick a room and a language, and follow the live captions.
          </span>
        </a>

        <a class="landing-card" href="/stage.html">
          <svg class="landing-card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
            <path d="M12 19v3" />
          </svg>
          <span class="landing-card-title">Stage</span>
          <span class="landing-card-desc">
            Operator: send a room's audio and start captioning it.
          </span>
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <span>Captions are machine-generated and may contain errors.</span>
      <span class="footer-secondary">Open source · Apache-2.0</span>
    </footer>
  </body>
</html>
