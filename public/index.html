<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>captearla — live captions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand-group">
        <span class="brand">
          <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9h16" />
            <path d="M4 15h10" />
          </svg>
          <span class="brand-name">captearla</span>
        </span>
        <span class="divider" aria-hidden="true"></span>
      </div>

      <div class="topbar-controls">
        <div class="field">
          <label for="sessionSelect" class="mono-label">Session</label>
          <div class="select-wrap">
            <select id="sessionSelect"></select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </div>
        </div>

        <div class="field">
          <span class="mono-label" id="langLabel">Language</span>
          <div class="segmented" role="group" aria-label="Caption language" aria-labelledby="langLabel" id="langSegmented">
            <button type="button" data-lang="original" aria-pressed="true">Original</button>
            <button type="button" data-lang="es" aria-pressed="false">Español</button>
            <button type="button" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <span id="statusBadge" class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span id="statusLabel">Connecting…</span>
      </span>

      <button id="projectorButton" class="btn" aria-label="Toggle projector mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5" />
          <path d="M20 9V4h-5" />
          <path d="M4 15v5h5" />
          <path d="M20 15v5h-5" />
        </svg>
        <span class="btn-label">Projector</span>
      </button>
    </header>

    <div class="projector-bar">
      <span class="projector-bar-left">
        <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 9h16" />
          <path d="M4 15h10" />
        </svg>
        <span id="projectorMeta" class="mono-label projector-bar-meta"></span>
      </span>
      <button id="projectorExitButton" class="projector-exit-btn" aria-label="Exit projector mode">Exit</button>
    </div>

    <main class="viewer-main">
      <p id="captionMeta" class="caption-meta mono-label"></p>
      <div id="captions" class="captions"></div>
    </main>

    <footer class="site-footer">
      <span>Captions are machine-generated and may contain errors.</span>
      <span class="footer-secondary">Open source · Apache-2.0</span>
    </footer>

    <script type="module" src="/viewer.js"></script>
  </body>
</html>
